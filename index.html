<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --fg: #f5f5f7;
    --accent: #6ee7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  h1 span {
    color: var(--accent);
  }
  p {
    margin: 0;
    opacity: 0.7;
    font-size: 1.1rem;
  }
</style>
</head>
<body>
  <main>
    <h1>switch<span>.</span></h1>
    <p>Bine ai venit.</p>
  </main>
</body>
</html>
